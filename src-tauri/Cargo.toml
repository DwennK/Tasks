[package]
name = "tasks-desktop"
version = "0.2.0"
edition = "2021"
default-run = "tasks-desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tasks-core = { path = "../crates/tasks-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "form", "query", "rustls"] }
sha2 = "0.10"
getrandom = "0.3"
chrono = "0.4"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
base64 = "0.22"
tempfile = "3"
tauri-plugin-deep-link = "2"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-updater = "2"


[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSImage", "NSWindow", "NSButton", "NSView"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSThread"] }
