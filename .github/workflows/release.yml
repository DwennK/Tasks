name: Release macOS
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v0.2.0)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Validate release version and signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'Configure TAURI_SIGNING_PRIVATE_KEY first.'; exit 1; }
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          version = json.loads(Path('package.json').read_text())['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version), 'Use a stable semantic version'
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag does not match package version'
          assert json.loads(Path('src-tauri/tauri.conf.json').read_text())['version'] == version
          assert f'version = "{version}"' in Path('src-tauri/Cargo.toml').read_text()
          PY
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: python3 -m unittest discover -s tests/release -v
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Configure optional Apple distribution credentials
        env:
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python3 - <<'PY'
          import os
          names = {'SIGN_IDENTITY':'APPLE_SIGNING_IDENTITY','APPLE_ID':'APPLE_ID','APPLE_PASSWORD':'APPLE_PASSWORD','APPLE_TEAM_ID':'APPLE_TEAM_ID'}
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              for source, target in names.items():
                  value = os.environ.get(source, '')
                  if value:
                      assert '\n' not in value
                      f.write(f'{target}={value}\n')
          PY
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        with:
          tauriScript: pnpm tauri
          args: --target universal-apple-darwin --bundles app,dmg
          uploadUpdaterJson: false
      - name: Verify bundle and prepare release assets
        run: |
          APP='target/universal-apple-darwin/release/bundle/macos/Tasks.app'
          codesign --verify --deep --strict "$APP"
          lipo -verify_arch arm64 x86_64 "$APP/Contents/MacOS/tasks-desktop"
          cp docs/release-notes.md release-notes.md
          if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            xcrun stapler validate "$APP"
          else
            cat >> release-notes.md <<'NOTE'

          > This build is ad hoc signed and is not notarized by Apple. macOS may block the first launch; use its normal Privacy & Security approval only if you trust this project. Homebrew does not bypass Gatekeeper. Update archives are separately signed and verified by Tasks.
          NOTE
          fi
          python3 scripts/prepare-release.py --bundle target/universal-apple-darwin/release/bundle --output release-assets --tag "$RELEASE_TAG" --notes release-notes.md
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Tasks ${RELEASE_TAG#v}" --notes-file release-notes.md
          fi
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true || { echo 'Published releases are immutable; use a new version.'; exit 1; }
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest --notes-file release-notes.md
