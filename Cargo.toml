[workspace]
members = ["crates/tasks-core", "crates/tasks-cli", "crates/tasks-mcp", "src-tauri"]
default-members = ["crates/tasks-core", "crates/tasks-cli", "crates/tasks-mcp"]
resolver = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = "s"

# Rust/LLVM on macOS can produce invalid LINKEDIT data when stripping
# procedural-macro dylibs (rust-lang/rust#157750). Keep host build tools
# unstripped while still stripping the delivered application and CLI.
[profile.release.build-override]
strip = false

